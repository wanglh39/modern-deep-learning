name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter Book
        run: |
          pip install "jupyter-book==1.0.4.post1" "sphinx-book-theme==1.1.0" myst-parser

      - name: Fix sphinx_thebe bug
        run: |
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          THEBE_INIT="$SITE_PACKAGES/sphinx_thebe/__init__.py"
          if [ -f "$THEBE_INIT" ]; then
            sed -i 's/    cm_language = kernel_name$/    cm_language = kernel_name or "python3"/' "$THEBE_INIT"
            echo "Fixed sphinx_thebe bug"
          fi

      - name: Build the book
        run: |
          JB_PATH=$(python -c "import sys; print(sys.prefix)")/bin/jb
          $JB_PATH build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
